amplification:
  all_of:
    - {field: adjusted_cn, operator: ">=", value: 6}
duplication:
  filter: false
  all_of:
    - {field: adjusted_cn, operator: ">", value: 2.5}
    - {field: adjusted_cn, operator: "<", value: 6}
deletion:
  all_of:
    - {field: adjusted_cn, operator: "<", value: 1.4}
loh:
  label: "LOH"
  all_of:
    - {field: adjusted_cn, operator: ">=", value: 1.4}
    - {field: adjusted_cn, operator: "<=", value: 2.5}
    - not:
        all_of:
          - {field: baf, operator: ">", value: 0.3}
          - {field: baf, operator: "<", value: 0.7}
